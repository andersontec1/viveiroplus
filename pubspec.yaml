name: viveiro_plus
description: "A new Flutter project."
publish_to: 'none'

version: 2.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.0.0
  csv: ^6.0.0
  share_plus: ^11.1.0
  path_provider: ^2.1.2
  web: ^1.1.1 # Suporte a API Web moderna (Blob, URL, HTMLAnchorElement) via package:web
  # Utilitários
  intl: ^0.20.2
  mobile_scanner: ^7.1.2
  flutter_riverpod: ^2.6.1
  package_info_plus: ^8.3.1
  fl_chart: ^1.1.1
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.2
  permission_handler: ^11.4.0

  # Firebase
  firebase_core: ^4.1.1
  firebase_core_web: ^3.1.1
  firebase_auth: ^6.1.0
  firebase_auth_web: ^6.0.3
  cloud_firestore: ^6.0.2
  cloud_firestore_web: ^5.0.2

  # Para lembrar usuário/senha
  shared_preferences: ^2.1.1

  # State management, autenticação local e storage seguro
  provider: ^6.0.5
  connectivity_plus: ^6.1.5
  local_auth: ^2.1.3
  flutter_secure_storage: ^9.2.4

  flutter_web_plugins:
    sdk: flutter
  flutter_datetime_picker_plus: ^2.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.5.1
  firebase_auth_mocks: ^0.15.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/mascote.png
    - assets/images/camaraoico.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Boldonse-Regular.ttf