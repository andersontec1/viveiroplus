fl_chart: ^0.66.0
name: viveiro_plus
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.0.0
  csv: ^5.0.2
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  universal_html: ^2.2.3  # 👈 adicionado aqui
  # Utilitários
  intl: ^0.20.2
  mobile_scanner: ^3.5.2
  flutter_riverpod: ^2.5.1
  package_info_plus: ^8.3.0
  fl_chart: ^0.66.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_core_web: ^2.10.0
  firebase_auth: ^4.18.0
  firebase_auth_web: ^5.8.0
  cloud_firestore: ^4.16.0
  cloud_firestore_web: ^3.8.0

  # Para lembrar usuário/senha
  shared_preferences: ^2.1.1

  # State management, autenticação local e storage seguro
  provider: ^6.0.5
  connectivity_plus: ^6.1.4
  local_auth: ^2.1.3
  flutter_secure_storage: ^8.0.0

  flutter_web_plugins:
    sdk: flutter
  flutter_datetime_picker_plus: ^2.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.17
  firebase_auth_mocks: ^0.13.0
  flutter_lints: ^3.0.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Boldonse-Regular.ttf